repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Runs the project's own mypy from .venv (same version, packages and command as CI), so it
  # can't drift from uv.lock. language: unsupported = pre-commit doesn't build an env for it.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked mypy .
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]
